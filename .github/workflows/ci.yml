name: Verify MVP
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python -m property_finder.refresh
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: property-finder-preview
          path: dist
