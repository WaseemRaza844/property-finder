name: Refresh and deploy Property Finder
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: property-finder-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - name: Refresh authorized imports
        id: refresh
        continue-on-error: true
        run: python -m property_finder.refresh
      - name: Build static artifact including truthful source errors
        run: python scripts/build.py
      - name: Persist four-day observations and price history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/listings.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh authorized property observations'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Record source failures
        if: steps.refresh.outcome == 'failure'
        run: echo 'One or more imports failed. Published source status and retained observations.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
